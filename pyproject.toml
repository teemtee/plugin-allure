[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tmt-plugin-allure"
version = "0.1.0"
description = "Report tmt results in the format consumed by Allure 3"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Minxi Hou", email = "houminxi@yinhe.ht" },
    ]
dependencies = [
    "tmt>=1.81",
    ]

[project.entry-points."tmt.plugin"]
AllureReport = "tmt_plugin_allure.allure:ReportAllure"

[project.entry-points."tmt.resources"]
AllureResources = "tmt_plugin_allure"

[tool.hatch.build.targets.wheel]
packages = ["tmt_plugin_allure"]

[dependency-groups]
tests = [
    "pytest",
    ]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle error
    "F",  # pyflakes
    "W",  # pycodestyle warning
    "I",  # isort
    "B",  # flake8-bugbear
    "D",  # pydocstyle
    "PT",  # flake8-pytest-style
    "UP",  # pyupgrade
    ]
ignore = [
    # tmt keeps these as well, so the plugin can move between the two trees
    "UP045",
    "UP007",
    "D203",
    "D212",
    "D200",
    ]

[tool.ruff.lint.isort]
known-first-party = ["tmt_plugin_allure"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",  # the tests are named after what they check, no docstring needed
    "S101",  # pytest uses assert
    ]
